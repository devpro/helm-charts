# runs once for a merge request, and once for the default branch;
# the default branch publishes the documentation site, as the Pages of the GitHub repository serve the chart repository
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - deploy

include:
  # pins a commit, as a tag can move
  - component: $CI_SERVER_FQDN/devpro-labs/compliance/gitlab-components/markup-lint@d2f251b389031260f8efd6aafec6acccbb098b5d
  - component: $CI_SERVER_FQDN/devpro-labs/compliance/gitlab-components/helm-quality@d2f251b389031260f8efd6aafec6acccbb098b5d
  - component: $CI_SERVER_FQDN/devpro-labs/compliance/gitlab-components/pages-deployment@d2f251b389031260f8efd6aafec6acccbb098b5d
    inputs:
      build_command: npm ci && npm run docs:build

helm-quality:
  before_script:
    # adds the chart repositories of the dependencies
    - ./scripts/add_helm_repo.sh
