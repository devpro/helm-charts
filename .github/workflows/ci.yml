name: CI
# title: CI (Continuous Integration) pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHARTS_DIRECTORIES_ARG: "--chart-dirs charts"

jobs:
  docs:
    name: Docs
    uses: devpro/github-workflow-parts/.github/workflows/reusable-pages-deployment.yml@3f5c3623b3ed2e1c59924764f492b7bc2346bd61
    with:
      # VitePress writes the site the GitLab pipeline publishes, which this job only builds.
      deploy: false
      job-name: Docs
      site-path: public
      workflow-parts-version: 3f5c3623b3ed2e1c59924764f492b7bc2346bd61

  charts:
    name: Charts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Read from the environment rather than pasted into the scripts by GitHub.
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # note: important to have chart-testing work (see https://github.com/helm/chart-testing/issues/186)
          fetch-depth: 0
      - name: Install Helm
        uses: devpro/github-workflow-parts/actions/helm/setup@3f5c3623b3ed2e1c59924764f492b7bc2346bd61
      - name: Install kube-linter
        uses: devpro/github-workflow-parts/actions/kube-linter/setup@3f5c3623b3ed2e1c59924764f492b7bc2346bd61
      - name: Run kube-linter
        run: kube-linter lint charts --config .kube-linter.yaml
      - name: Set up chart-testing
        uses: devpro/github-workflow-parts/actions/chart-testing/setup@3f5c3623b3ed2e1c59924764f492b7bc2346bd61
      - name: Add dependency chart repositories
        run: ./scripts/add_helm_repo.sh
      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed ${CHARTS_DIRECTORIES_ARG} --target-branch "$DEFAULT_BRANCH")
          charts=$(echo "$changed" | tr '\n' ' ' | xargs)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_charts=$charts" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint charts
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint $CHARTS_DIRECTORIES_ARG --target-branch "$DEFAULT_BRANCH"
      - name: Install kubeconform
        uses: devpro/github-workflow-parts/actions/kubeconform/setup@3f5c3623b3ed2e1c59924764f492b7bc2346bd61
      - name: Validate manifests against the Kubernetes schemas
        run: ./scripts/validate_charts.sh
      # The standalone binary of the helm-unittest plugin, so no plugin is installed into Helm.
      - name: Install helm-unittest
        uses: devpro/github-workflow-parts/actions/helm-unittest/setup@3f5c3623b3ed2e1c59924764f492b7bc2346bd61
      - name: Run chart unit tests
        run: |
          charts=$(dirname charts/*/tests | sort -u)
          untt $charts
      # kind and kubectl are installed by an action of the workflow parts, as helm/kind-action is a JavaScript action, and a container image has neither preinstalled.
      - name: Install kind and kubectl
        if: steps.list-changed.outputs.changed == 'true'
        uses: devpro/github-workflow-parts/actions/kind/setup@3f5c3623b3ed2e1c59924764f492b7bc2346bd61
      # The cluster name carries the run, so two runs on one Docker daemon never share a cluster.
      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        run: kind create cluster --name "ct-${GITHUB_RUN_ID}" --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed --wait 120s
      - name: Install charts
        if: steps.list-changed.outputs.changed == 'true'
        env:
          # Charts that cannot reach a ready state on a bare cluster, given here rather than in ct.yaml so that ct lint still covers them.
          # Custom resources only, whose CRDs a bare cluster lacks: capi-templates, gitops-bootstrap, letsencrypt, rancher-cluster-templates.
          # Cloud providers and storage drivers: azure-storage, outscale.
          # Private images, which the cluster cannot pull: fallstar, liveship, sidelab, trackboard.
          # Default images no longer published: wordpress.
          EXCLUDED_CHARTS: >-
            capi-templates,gitops-bootstrap,letsencrypt,rancher-cluster-templates,
            azure-storage,outscale,
            fallstar,liveship,sidelab,trackboard,
            wordpress
        run: |
          ct install ${CHARTS_DIRECTORIES_ARG} --target-branch "$DEFAULT_BRANCH" \
            --excluded-charts "${EXCLUDED_CHARTS// /}" --helm-extra-args "--timeout 300s"
      - name: Delete kind cluster
        if: always() && steps.list-changed.outputs.changed == 'true'
        run: kind delete cluster --name "ct-${GITHUB_RUN_ID}"
