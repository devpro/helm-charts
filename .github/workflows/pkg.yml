name: PKG
# title: Continuous Delivery (Packaging)
# requirements: a "gh-pages" branch holding index.yaml, with index.tpl and placeholder.png for the index page, and Pages published from GitHub Actions

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  helm-publication:
    name: Helm
    uses: devpro/github-workflow-parts/.github/workflows/reusable-helm-publication.yml@99e797d0672c8a4fb39c4174173fa677c00a5d1e
    with:
      workflow-parts-version: 99e797d0672c8a4fb39c4174173fa677c00a5d1e
