name: PKG
# title: Continuous Delivery (Packaging)
# requirements: a "gh-pages" branch holding index.yaml, with index.tpl and placeholder.png for the index page, and Pages published from GitHub Actions

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  helm-publication:
    name: Helm
    uses: devpro/github-workflow-parts/.github/workflows/reusable-helm-publication.yml@8c856cd16adc8a0ca01c7889a9c7d98ad8593818
    with:
      workflow-parts-version: 8c856cd16adc8a0ca01c7889a9c7d98ad8593818
