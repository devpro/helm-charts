name: PKG
# title: Continuous Delivery (Packaging)
# requirements: a "gh-pages" branch holding index.yaml, with index.tpl and placeholder.png for the index page, and Pages published from GitHub Actions

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  helm-publication:
    name: Helm
    uses: devpro/github-workflow-parts/.github/workflows/reusable-helm-publication.yml@bf95c99bf5b5a0bc2d2991c81975488a16f16142
    with:
      workflow-parts-version: bf95c99bf5b5a0bc2d2991c81975488a16f16142
