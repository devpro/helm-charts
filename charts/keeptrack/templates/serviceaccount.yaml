{{- if .Values.security.serviceAccount.create }}
{{- $applications := list .Values.blazorapp .Values.webapi -}}
{{ range $applications }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    app.kubernetes.io/name: {{ .name }}
    {{- include "keeptrack.commonLabels" (dict "app" . "root" $) | nindent 4 }}
automountServiceAccountToken: false
{{ end }}
{{- end }}
