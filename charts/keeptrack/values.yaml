blazorapp:
  enabled: true
  role: frontend
  name: keeptrack-blazorapp
  image: docker.io/devprofr/keeptrack-blazorapp
  port: 80
  containerPort: 8080
  healthEndpoint: /health
  tls:
    secretName: keeptrack-blazorapp-tls
  tag: 2.3.29668982088      # ref. https://hub.docker.com/r/devprofr/keeptrack-blazorapp/tags
  replicaCount: 1
  resources: {}
    # limits:
    #   cpu: 200m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 64Mi
  extraEnv: []
    # - name: xxx
    #   value: "yyyy"
  additionalPodLabels: {}
  host: ""
  # Blazor Server scale-out support - see README "Scaling & high availability".
  # Persists the app's Data Protection key ring (which encrypts the auth cookie and antiforgery tokens)
  # in MongoDB, so every replica can decrypt what any other replica issued. REQUIRED before setting replicaCount > 1;
  # recommended even at 1 replica (sessions then survive pod restarts).
  dataProtection:
    enabled: false
    # important when enabled: connectionString or connectionStringSecretKeyRef must be provided
    # (typically the same secret as webapi.db)
    # connectionStringSecretKeyRef:
    #   name: ""
    #   key: ""
    # connectionString: ""
    databaseName: "keeptrack"
  # Forces the Blazor Server circuit onto a single WebSocket with no negotiate round-trip, so a circuit
  # naturally sticks to the replica that owns its state -
  # no load-balancer cookie affinity needed, which makes replicaCount > 1 work behind anything that passes WebSockets through (cloudflared, Traefik, plain Services).
  # Only set to false if a proxy in front can't pass WebSockets;
  # such a deployment must then stay at replicaCount 1.
  webSocketsOnly: true

webapi:
  enabled: true
  role: backend
  name: keeptrack-webapi
  image: docker.io/devprofr/keeptrack-webapi
  port: 80
  containerPort: 8080
  healthEndpoint: /health
  tls:
    secretName: keeptrack-webapi-tls
  host: ""
  replicaCount: 1
  tag: 2.3.29668982088    # ref. https://hub.docker.com/r/devprofr/keeptrack-webapi/tags
  resources: {}
  extraEnv: []
  additionalPodLabels: {}
  # how many items a signed-in account WITHOUT the Firebase "member"/"admin" role may create per free-tier collection (movies, TV shows);
  # such accounts have no access to the other collections at all -
  # grant `role: member` via the Firebase Admin SDK to unlock everything (see the app's CONTRIBUTING.md)
  freeTierItemLimit: 20
  db:
    # important: connectionString or connectionStringSecretKeyRef must be provided
    # connectionStringSecretKeyRef:
    #   name: ""
    #   key: ""
    # connectionString: "someconnstring"
    databaseName: "keeptrack"
  # optional: third-party providers used to enrich movies/TV shows/video games/books/albums with posters, synopsis, cast and episode data.
  # Leaving a key empty just means that provider's enrichment silently fails (401/403 from the provider) - the rest of the app is unaffected.
  referenceData:
    # overrides the app's own default ("OpenLibrary") - see WebApi's AppConfiguration.BookReferenceProvider
    bookProvider: ""
    # periodic background re-sync of stale reference data (every 24h); matches the app's own default
    isSyncEnabled: true
    tmdb:
      # apiKeySecretKeyRef:
      #   name: ""
      #   key: ""
      apiKey: ""
    rawg:
      # apiKeySecretKeyRef:
      #   name: ""
      #   key: ""
      apiKey: ""
    discogs:
      # tokenSecretKeyRef:
      #   name: ""
      #   key: ""
      token: ""
    googlebooks:
      # apiKeySecretKeyRef:
      #   name: ""
      #   key: ""
      apiKey: ""

dotnet:
  environment: Production
  logLevels:
    default: Information
    framework: Information
    application: Information
  scalarEnabled: false
  httpsRedirectionEnabled: false

# optional: image registry credentials, e.g. for a private mirror of the images above
imagePullSecrets: []
  # - name: my-registry-secret

security:
  serviceAccount:
    create: false
  # Hardened container settings for platforms that mandate the Kubernetes Pod Security Standards "restricted" profile (or an equivalent CIS benchmark policy):
  # seccompProfile, dropping all Linux capabilities, and a read-only root filesystem. Disabled by default -
  # readOnlyRootFilesystem needs to be validated against each environment before being turned on broadly
  # (it redirects HOME to an emptyDir-backed /tmp so .NET's own writes, e.g. Data Protection keys, keep working).
  hardened:
    enabled: false

# mandatory
firebase:
  auth: {}
    # authoritySecretKeyRef:
    #   name: ""
    #   key: ""
    # apiKey: ""
  webApp: {}
    # apiKeySecretKeyRef:
    #   name: ""
    #   key: ""
    # apiKey: ""
    # authDomainSecretKeyRef:
    #   name: ""
    #   key: ""
    # authDomain: ""
    # projectIdSecretKeyRef:
    #   name: ""
    #   key: ""
    # projectId: ""
  # serviceAccountSecretKeyRef:
    #   name: ""
    #   key: ""
  # serviceAccount:
  #   type: "service_account"
  #   project_id: ""
  #   private_key_id: ""
  #   private_key: ""
  #   client_email: ""
  #   client_id: ""
  #   auth_uri: ""
  #   token_uri: ""
  #   auth_provider_x509_cert_url: ""
  #   client_x509_cert_url: ""
  #   universe_domain: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod

# embedded chart configuration: https://github.com/bitnami/charts/blob/main/bitnami/mongodb/values.yaml
mongodb:
  enabled: false
  global:
  #   imageRegistry: ""
  #   imagePullSecrets: []
  #   defaultStorageClass: ""
  #   storageClass: ""
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: bitnami/mongodb     # other options: chainguard/mongodb
    tag: latest                     # IMPORTANT: latest should never be used in Production
  auth: {}
    # rootPassword: ""
    # existingSecret: ""
