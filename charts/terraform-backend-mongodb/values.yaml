webapi:
  enabled: true
  host: ""
  name: tfbackend
  image: docker.io/devprofr/terraform-backend-mongodb
  # images are hosted on DockerHub: https://hub.docker.com/r/devprofr/terraform-backend-mongodb/tags
  tag: "1.2.3"             # pins to Chart.yaml appVersion - avoid floating tags (e.g. latest) in Production
  replicaCount: 1
  port: 80
  containerPort: 8080
  healthEndpoint: /health
  db:
    # important: connectionString or connectionStringSecretKeyRef must be provided
    # connectionStringSecretKeyRef:
    #   name: ""
    #   key: ""
    connectionString: "someconnstring"
    databaseName: "somedb"
  extraEnv: []
    # - name: xxx
    #   value: "yyyy"
  additionalPodLabels: {}
  tls:
    secretName: tfbackend-tls
  resources: {}
    # limits:
    #   cpu: 200m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 64Mi

dotnet:
  environment: Production
  logLevels:
    default: Information
    framework: Information
    application: Information
  enableScalar: false
  # false by default: the app redirects to HTTPS internally, which fights a TLS-terminating ingress
  # that forwards plain HTTP to the pod.
  httpsRedirectionEnabled: false
  # The app image always ships with .NET auto-instrumentation baked in (see Dockerfile); these settings
  # only control the standard OTEL_* exporter env vars the agent reads - they don't turn the agent itself
  # on or off. When disabled, exporters are set to "none" so the agent doesn't try to reach a collector.
  openTelemetry:
    enabled: false
    # defaults to webapi.name when empty
    serviceName: ""
    # OTLP collector endpoint, e.g. http://otel-collector:4318
    endpoint: ""
    protocol: "http/protobuf"

# optional: image registry credentials, e.g. for a private mirror of the image above
imagePullSecrets: []
  # - name: my-registry-secret

security:
  serviceAccount:
    create: false
  # Hardened container settings for platforms that mandate the Kubernetes Pod Security Standards "restricted" profile (or an equivalent CIS benchmark policy):
  # seccompProfile, dropping all Linux capabilities, and a read-only root filesystem. Disabled by default -
  # readOnlyRootFilesystem needs to be validated against each environment before being turned on broadly
  # (it redirects HOME to an emptyDir-backed /tmp so .NET's own writes keep working).
  hardened:
    enabled: false

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod

# embedded chart configuration: https://github.com/bitnami/charts/blob/main/bitnami/mongodb/values.yaml
mongodb:
  enabled: false
  global:
  #   imageRegistry: ""
  #   imagePullSecrets: []
  #   defaultStorageClass: ""
  #   storageClass: ""
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: bitnami/mongodb     # other options: chainguard/mongodb
    tag: latest                     # IMPORTANT: latest should never be used in Production
  auth: {}
    # rootPassword: ""
    # existingSecret: ""
