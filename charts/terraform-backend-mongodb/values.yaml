webapi:
  enabled: true
  host: ""
  name: tfbackend
  image: docker.io/devprofr/terraform-backend-mongodb
  # images are hosted on DockerHub: https://hub.docker.com/r/devprofr/terraform-backend-mongodb/tags
  tag: "1.3.0"             # pins to Chart.yaml appVersion - avoid floating tags (e.g. latest) in Production
  replicaCount: 1
  port: 80
  containerPort: 8080
  healthEndpoint: /health
  db:
    # -- Full MongoDB connection string, e.g. mongodb://user:pass@host:27017/?authSource=admin
    # Not needed if mongodb.enabled=true below - the chart wires that up for you from
    # mongodb.auth.rootPassword. Rendered as a plain env var unless connectionStringSecretKeyRef
    # below is set instead.
    connectionString: ""
    # -- Use your own pre-created Secret instead of connectionString above (rendered via secretKeyRef).
    # Takes priority over connectionString and over the bundled mongodb chart below.
    # connectionStringSecretKeyRef:
    #   name: ""
    #   key: ""
    databaseName: "tfbackend"
  extraEnv: []
    # - name: xxx
    #   value: "yyyy"
  additionalPodLabels: {}
  tls:
    secretName: tfbackend-tls
  resources: {}
    # limits:
    #   cpu: 200m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 64Mi
  # -- Pod affinity/anti-affinity/node-affinity rules, passed through as-is.
  # Defaults to requiring amd64 nodes: the image's baked-in OpenTelemetry auto-instrumentation
  # native library (see Dockerfile) is amd64-only, so an arm64 node would fail to load the
  # profiler. Clear this (affinity: {}) once/if an arm64-compatible image is published.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: "kubernetes.io/arch"
              operator: In
              values: ["amd64"]

dotnet:
  environment: Production
  logLevels:
    default: Information
    framework: Information
    application: Information
  enableScalar: false
  # false by default: the app redirects to HTTPS internally, which fights a TLS-terminating ingress
  # that forwards plain HTTP to the pod.
  httpsRedirectionEnabled: false
  # The app image always ships with .NET auto-instrumentation baked in (see Dockerfile); these settings
  # only control the standard OTEL_* exporter env vars the agent reads - they don't turn the agent itself
  # on or off. When disabled, exporters are set to "none" so the agent doesn't try to reach a collector.
  openTelemetry:
    enabled: false
    # defaults to webapi.name when empty
    serviceName: ""
    # OTLP collector endpoint, e.g. http://otel-collector:4318
    endpoint: ""
    protocol: "http/protobuf"

# Authentication hardening, available from application version 1.3.0.
# Terraform's http backend sends a Basic credential on every single request and supports no token, so the same password is verified over and over and every failed guess costs the server a BCrypt verify.
authentication:
  # -- How long a verified credential is reused without running BCrypt again, which is what stops a busy terraform apply paying around 139 ms of CPU on every request.
  # Set to 0 to disable the cache.
  credentialCacheSeconds: 60
  # -- Consecutive failures before that username is refused from that source address.
  maxFailedAttempts: 10
  # -- How long the refusal lasts.
  lockoutSeconds: 300

# Which reverse proxies the application believes when it reads the caller's address.
# This is a prerequisite for the lockout above and for the authentication failure log, not a detail: behind an ingress an unconfigured application sees the proxy's address on every request, so every caller shares one lockout bucket and an attacker on the internet can lock the real operator out of the backend.
network:
  # -- Accept X-Forwarded-For from any caller.
  # It defaults to true because it is the only setting that works behind an ingress whose address is not known in advance, and because the alternative, every request looking like the ingress, is worse than the risk it avoids.
  # It is safe where the pod is reachable through the ingress alone.
  # Where other workloads can reach the service directly and are not trusted, set this to false and list the ingress below instead.
  trustAllProxies: true
  # -- Specific proxy addresses to trust, read only when trustAllProxies is false.
  knownProxies: []
    # - 10.0.0.7
  # -- Networks to trust in CIDR notation, read only when trustAllProxies is false.
  knownNetworks: []
    # - 10.42.0.0/16

# optional: image registry credentials, e.g. for a private mirror of the image above
imagePullSecrets: []
  # - name: my-registry-secret

security:
  serviceAccount:
    create: false
  # Hardened container settings for platforms that mandate the Kubernetes Pod Security Standards "restricted" profile (or an equivalent CIS benchmark policy):
  # seccompProfile, dropping all Linux capabilities, and a read-only root filesystem. Disabled by default -
  # readOnlyRootFilesystem needs to be validated against each environment before being turned on broadly
  # (it redirects HOME to an emptyDir-backed /tmp so .NET's own writes keep working).
  hardened:
    enabled: false

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod

# embedded chart configuration: https://github.com/bitnami/charts/blob/main/bitnami/mongodb/values.yaml
mongodb:
  enabled: false
  global:
  #   imageRegistry: ""
  #   imagePullSecrets: []
  #   defaultStorageClass: ""
  #   storageClass: ""
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: bitnami/mongodb     # other options: chainguard/mongodb
    tag: latest                     # IMPORTANT: latest should never be used in Production
  auth: {}
    # -- Required when mongodb.enabled=true, unless webapi.db.connectionString or
    # webapi.db.connectionStringSecretKeyRef is set instead. This is intentionally not
    # auto-generated: the same value has to reach both this subchart's own root user AND
    # the webapi connection string, and Helm cannot pass a chart-generated value into a
    # subchart's values.
    # rootPassword: ""
    # existingSecret: ""
