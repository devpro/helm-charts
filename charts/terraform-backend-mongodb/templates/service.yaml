{{- $applications := list .Values.webapi -}}
{{ range $applications }}
{{- if .enabled -}}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
    app.kubernetes.io/name: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
    {{- include "terraform-backend-mongodb.commonLabels" (dict "app" . "root" $) | nindent 4 }}
  name: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .port }}
      targetPort: {{ .containerPort }}
      protocol: TCP
      name: http
  selector:
    app: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
    app.kubernetes.io/name: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
{{- end }}
{{ end }}
