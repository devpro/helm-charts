{{- $applications := list .Values.webapi -}}
{{ range $applications }}
{{- if .enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
  labels:
    app: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
    app.kubernetes.io/name: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
    {{- include "terraform-backend-mongodb.commonLabels" (dict "app" . "root" $) | nindent 4 }}
spec:
  replicas: {{ .replicaCount }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
      app.kubernetes.io/name: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
  template:
    metadata:
      labels:
        app: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
        app.kubernetes.io/name: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
        {{- include "terraform-backend-mongodb.commonLabels" (dict "app" . "root" $) | nindent 8 }}
        {{- if .additionalPodLabels }}
        {{- toYaml .additionalPodLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.security.serviceAccount.create }}
      serviceAccountName: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.security.hardened.enabled }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: {{ .name }}
          image: {{ .image }}:{{ .tag }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ .containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .healthEndpoint }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .healthEndpoint }}
              port: http
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654   # "app" user
            runAsGroup: 1654  # "app" group
            allowPrivilegeEscalation: false
            {{- if $.Values.security.hardened.enabled }}
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            {{- end }}
          {{- if $.Values.security.hardened.enabled }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
          env:
          {{- if $.Values.security.hardened.enabled }}
            - name: HOME
              value: /tmp
          {{- end }}
          {{- if .extraEnv }}
            {{- toYaml .extraEnv | nindent 12 }}
          {{- end }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
            - name: ASPNETCORE_ENVIRONMENT
              value: "{{ $.Values.dotnet.environment }}"
            - name: Logging__LogLevel__Default
              value: {{ $.Values.dotnet.logLevels.default | quote }}
            - name: Logging__LogLevel__Microsoft.AspNetCore
              value: {{ $.Values.dotnet.logLevels.framework | quote }}
            - name: Logging__LogLevel__Devpro
              value: {{ $.Values.dotnet.logLevels.application | quote }}
            - name: Features__IsHttpsRedirectionEnabled
              value: {{ $.Values.dotnet.httpsRedirectionEnabled | quote }}
            - name: Features__IsScalarEnabled
              value: {{ $.Values.dotnet.enableScalar | quote }}
            {{- if $.Values.dotnet.openTelemetry.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ $.Values.dotnet.openTelemetry.serviceName | default (include "terraform-backend-mongodb.fullname" (dict "app" . "root" $)) | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.dotnet.openTelemetry.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ $.Values.dotnet.openTelemetry.protocol | quote }}
            {{- else }}
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            {{- end }}
            {{- if .db.connectionStringSecretKeyRef }}
            - name: DatabaseSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .db.connectionStringSecretKeyRef.name }}
                  key: {{ .db.connectionStringSecretKeyRef.key }}
            {{- else }}
            - name: DatabaseSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "terraform-backend-mongodb.fullname" (dict "app" . "root" $) }}-db
                  key: connectionString
            {{- end }}
            - name: DatabaseSettings__DatabaseName
              value: {{ .db.databaseName | quote }}
      restartPolicy: Always
      {{- if $.Values.security.hardened.enabled }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
{{- end }}
{{ end }}
