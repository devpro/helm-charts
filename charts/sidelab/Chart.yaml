apiVersion: v2
name: sidelab
description: >
  Self-hosted interactive lab platform.
  Deploys the Sidelab launcher, which manages lab sessions as ephemeral Kubernetes Pods inside tenant-scoped namespaces.
type: application
version: 0.1.5
appVersion: "0.1.0"
keywords:
  - sidelab
  - labs
  - training
home: https://github.com/devpro/helm-charts
sources:
  - https://github.com/devpro/helm-charts
dependencies:
  - name: mongodb
    version: 19.1.24   # MongoDB 8.3.7
    repository: https://charts.bitnami.com/bitnami
    alias: mongodb
    condition: mongodb.enabled
maintainers:
  - name: devpro
    email: bertrand@devpro.fr
