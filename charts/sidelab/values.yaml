# -- Base domain: the dashboard defaults to sidelab.<domain> and lab sessions to *.labs.<domain>.
domain: ""

image:
  # -- Launcher image repository, required.
  repository:
  pullPolicy: IfNotPresent
  # -- Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
  # - name: ""

nameOverride: ""
fullnameOverride: ""

# -- More than one replica requires database.backend=mongo and persistence.enabled=false.
replicaCount: 1

auth:
  # -- Signing secret, generated on first install when empty and kept across upgrades.
  jwtSecret: ""
  # -- Initial admin account, only used while the database is empty.
  adminUsername: "admin"
  # -- Generated on first install when empty, the install notes show how to read it.
  adminPassword: ""
  # -- Existing Secret with the keys JWT_SECRET, ADMIN_USERNAME and ADMIN_PASSWORD, replacing the three values above.
  existingSecret: ""

database:
  # -- sqlite or mongo.
  backend: "sqlite"

  sqlite:
    path: "/app/data/sidelab.db"

  mongo:
    # -- Connection string, e.g. mongodb+srv://<user>:<password>@<host>/sidelab
    url: ""
    # -- Existing Secret with the key DB_URL, taking priority over url.
    existingSecret: ""

# Bundled Bitnami MongoDB, for a disposable demo only.
mongodb:
  enabled: false
  architecture: standalone
  auth:
    enabled: true
    # -- Required when mongodb.enabled=true, unless database.mongo.url or database.mongo.existingSecret is set.
    rootPassword: ""
  image:
    registry: docker.io
    repository: bitnami/mongodb   # other options: chainguard/mongodb
    tag: latest                   # IMPORTANT: latest should never be used in production
  persistence:
    enabled: true
    size: 4Gi
  global:
    security:
      allowInsecureImages: true

persistence:
  # -- Volume for /app/data, required with sqlite.
  enabled: true
  # -- Empty for the cluster default.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 2Gi
  # -- Existing PersistentVolumeClaim, instead of creating one.
  existingClaim: ""

launcher:
  backend: "kubernetes"

  labImage: "ghcr.io/devpro/sidelab-app:latest"
  labImagePullPolicy: "IfNotPresent"

  # -- Default session duration, in minutes.
  sessionDefaultDuration: 30
  # -- Maximum session duration, in minutes.
  sessionMaxDuration: 60

  # -- How lab sessions are exposed: nodeport or ingress.
  labAccess: "nodeport"

  # -- Wildcard domain of lab sessions when labAccess=ingress, defaults to labs.<domain>.
  labDomain: ""

  # -- ConfigMap holding a custom lab session Ingress template (key ingress-template.yaml), replacing the generated one.
  ingressTemplateConfigMap: ""

  # -- Prefix of tenant namespaces.
  namespacePrefix: "sidelab"

  # -- Additional tenant namespaces, comma-separated, only for namespaces created outside the launcher.
  knownNamespaces: ""

  # -- dockerconfigjson Secret in the release namespace used to pull labImage, copied into every tenant namespace.
  labImagePullSecret: ""

service:
  # -- ClusterIP, NodePort or LoadBalancer.
  type: ClusterIP
  port: 3000
  # -- Only used when service.type=NodePort.
  nodePort: ""

# Dashboard Ingress. className, tls and the cert-manager.io/cluster-issuer annotation also apply to lab sessions.
ingress:
  enabled: false
  # -- e.g. "traefik" or "nginx".
  className: ""
  # -- Dashboard hostname, defaults to sidelab.<domain>.
  host: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    # -- Lab session URLs use https only when true, including when TLS terminates in front of the cluster.
    enabled: false
    secretName: "sidelab-tls"

podSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000
  # runAsGroup: 1000
  # fsGroup: 1000
  # seccompProfile:
  #   type: RuntimeDefault

containerSecurityContext: {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true
  # capabilities:
  #   drop:
  #     - ALL

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 500m
  #   memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# Same requirements as replicaCount above.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Only useful with two or more replicas: with one, it blocks node drains.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  # -- Namespace of the ingress controller allowed to reach the dashboard.
  ingressControllerNamespace: "kube-system"
  # -- Pod labels of the ingress controller in that namespace.
  ingressControllerPodSelector:
    app.kubernetes.io/name: traefik
  # -- Additional namespaces allowed to reach the dashboard.
  additionalIngressNamespaces: []
  # -- Additional CIDRs allowed on egress.
  additionalEgressCIDRs: []

# Required: the launcher creates the namespaces, Pods, Services and Ingresses of lab sessions.
rbac:
  create: true

serviceAccount:
  create: true
  annotations: {}
  # -- Defaults to the chart fullname.
  name: ""
  # -- Required, the launcher calls the Kubernetes API with this token.
  automountServiceAccountToken: true

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

# -- Extra launcher environment variables.
# TRUST_PROXY is the number of proxies in front of the launcher, needed for per-IP login throttling behind an ingress.
extraEnv: []
  # - name: TRUST_PROXY
  #   value: "1"

extraVolumes: []
extraVolumeMounts: []
