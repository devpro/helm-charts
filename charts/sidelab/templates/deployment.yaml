apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sidelab.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.persistence.enabled }}
    # The data PVC is ReadWriteOnce (SQLite file, git course cache), so two Pods
    # must never run at once — Recreate, at the cost of brief dashboard downtime
    # on upgrades. Lab sessions are unaffected either way: their Pods keep
    # running and the launcher reconciles from the database on the way back up.
    type: Recreate
    {{- else }}
    # No PVC (mongo backend, no local state) — roll without downtime.
    type: RollingUpdate
    {{- end }}
  selector:
    matchLabels:
      {{- include "sidelab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sidelab.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # forces a rollout when the rendered ConfigMap/Secret content changes,
        # even if the image tag doesn't — env vars are only read at container
        # start, so Kubernetes won't otherwise notice a ConfigMap/Secret edit.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sidelab.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      restartPolicy: Always
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: launcher
          image: "{{ .Values.image.repository }}:{{ include "sidelab.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "sidelab.fullname" . }}-config
            # Auth secrets — the Secret's keys match these env var names exactly
            # (envFrom has no per-key rename).
            - secretRef:
                name: {{ include "sidelab.authSecretName" . }}
            {{- if eq .Values.database.backend "mongo" }}
            - secretRef:
                name: {{ include "sidelab.mongoSecretName" . }}
            {{- end }}
          env:
            # ── Kubernetes launcher identity ───────────────────────────────────
            # The launcher uses its own namespace + Service name to know which
            # Service lab Pods should call back to on session finish.
            - name: K8S_LAUNCHER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_LAUNCHER_SERVICE
              value: {{ include "sidelab.fullname" . }}
            # ── Node IP, used to build lab URLs when launcher.labAccess=nodeport ──
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Writable data volume (SQLite DB + git course cache)
            - name: data
              mountPath: /app/data
            {{- if eq .Values.launcher.labAccess "ingress" }}
            - name: ingress-template
              mountPath: /app/config
              readOnly: true
            {{- end }}
            # Writable /tmp — needed if you enable containerSecurityContext.readOnlyRootFilesystem
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "sidelab.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if eq .Values.launcher.labAccess "ingress" }}
        - name: ingress-template
          configMap:
            name: {{ include "sidelab.ingressTemplateConfigMap" . }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
