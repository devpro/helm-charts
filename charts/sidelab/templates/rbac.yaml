{{- if .Values.rbac.create }}
# Cluster-scoped because tenant namespaces are created on demand.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sidelab.fullname" . }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
rules:
  # Tenant namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]

  # Lab Pod lifecycle
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # Lab Services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]

  # No get or list: on a ClusterRole that would read every Secret in the cluster.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]

  # Lab Ingresses
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete"]

  # Attaches launcher.labImagePullSecret to the default ServiceAccount of tenant namespaces.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["default"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sidelab.fullname" . }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sidelab.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sidelab.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.launcher.labImagePullSecret }}
---
# Read access to the source pull secret only, in a namespaced Role rather than the ClusterRole above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sidelab.fullname" . }}-pull-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.launcher.labImagePullSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sidelab.fullname" . }}-pull-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sidelab.fullname" . }}-pull-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "sidelab.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
