{{- if .Values.rbac.create }}
# The launcher needs cluster-scoped permissions because it creates lab Pods in dynamically-named tenant namespaces (sidelab-<tenant>).
# A namespaced Role would require pre-creating one per tenant namespace, which defeats the purpose.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sidelab.fullname" . }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
rules:
  # Namespace management — creates sidelab-<tenant> on first lab start.
  # "list" is what discoverNamespaces() uses to find tenant namespaces by the app.kubernetes.io/managed-by=sidelab label,
  # for orphan cleanup on restart and the delete-by-label terminate fallback.
  # Without it the launcher degrades to launcher.knownNamespaces only; silently, since the failure is caught.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]

  # Lab Pod lifecycle
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # Lab Services (NodePort or ClusterIP for ingress backend)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]

  # Per-session Secrets holding private git PATs: created and deleted per session, never read back.
  # No get/list here: on a ClusterRole that would mean read access to every Secret in the cluster.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]

  # Lab Ingress resources (when K8S_LAB_ACCESS=ingress)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete"]

  # Attaches launcher.labImagePullSecret to each tenant namespace's default ServiceAccount so lab Pods can pull a private launcher.labImage.
  # resourceNames restricts this to the "default" ServiceAccount only, in any namespace.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["default"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sidelab.fullname" . }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sidelab.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sidelab.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.launcher.labImagePullSecret }}
---
# Scoped read access to the *source* pull secret only, deliberately a namespaced Role in this chart's own namespace, not added to the ClusterRole above,
# which would mean read access to every Secret in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sidelab.fullname" . }}-pull-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.launcher.labImagePullSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sidelab.fullname" . }}-pull-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sidelab.fullname" . }}-pull-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "sidelab.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
