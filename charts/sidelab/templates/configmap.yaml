apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sidelab.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
data:
  # Refuses to start without a real JWT_SECRET.
  NODE_ENV: "production"
  LAUNCHER_PORT: "3000"
  LAUNCHER_BACKEND: {{ .Values.launcher.backend | quote }}
  LAB_IMAGE: {{ .Values.launcher.labImage | quote }}
  K8S_IMAGE_PULL_POLICY: {{ .Values.launcher.labImagePullPolicy | quote }}
  # In minutes (the app parses these as minutes, not seconds).
  SESSION_DEFAULT_DURATION: {{ .Values.launcher.sessionDefaultDuration | quote }}
  SESSION_MAX_DURATION: {{ .Values.launcher.sessionMaxDuration | quote }}
  DB_BACKEND: {{ .Values.database.backend | quote }}
  {{- if eq .Values.database.backend "sqlite" }}
  DB_PATH: {{ .Values.database.sqlite.path | quote }}
  {{- end }}
  COURSE_CACHE_DIR: "/app/data/course-cache"
  K8S_LAB_ACCESS: {{ .Values.launcher.labAccess | quote }}
  {{- if eq .Values.launcher.labAccess "ingress" }}
  K8S_LAB_DOMAIN: {{ include "sidelab.labDomain" . | quote }}
  K8S_INGRESS_TEMPLATE: "/app/config/ingress-template.yaml"
  {{- end }}
  K8S_NAMESPACE_PREFIX: {{ .Values.launcher.namespacePrefix | quote }}
  {{- if .Values.launcher.labImagePullSecret }}
  K8S_LAB_IMAGE_PULL_SECRET: {{ .Values.launcher.labImagePullSecret | quote }}
  {{- end }}
  # The admin tenant's namespace is the default, as a fallback when namespaces cannot be listed.
  K8S_KNOWN_NAMESPACES: {{ .Values.launcher.knownNamespaces | default (printf "%s-admin" .Values.launcher.namespacePrefix) | quote }}
---
{{- if and (eq .Values.launcher.labAccess "ingress") (not .Values.launcher.ingressTemplateConfigMap) }}
# Default Ingress template for lab sessions, reusing the dashboard's ingress.className, ingress.tls and cert-manager annotation.
# launcher.ingressTemplateConfigMap replaces it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sidelab.ingressTemplateConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
data:
  ingress-template.yaml: |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: "{{"{{"}}SESSION_ID{{"}}"}}"
      namespace: "{{"{{"}}NAMESPACE{{"}}"}}"
      labels:
        app: sidelab-lab
        sidelab.io/session: "{{"{{"}}SESSION_ID{{"}}"}}"
        sidelab.io/tenant: "{{"{{"}}TENANT{{"}}"}}"
      annotations:
        # Long-lived WebSockets (terminal, VNC) — ingress-nginx otherwise drops
        # them after its 60s default proxy-read-timeout. Traefik ignores these.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
        {{- $issuer := index (.Values.ingress.annotations | default dict) "cert-manager.io/cluster-issuer" }}
        {{- if $issuer }}
        cert-manager.io/cluster-issuer: {{ $issuer | quote }}
        {{- end }}
    spec:
      {{- if .Values.ingress.className }}
      ingressClassName: {{ .Values.ingress.className | quote }}
      {{- end }}
      {{- if .Values.ingress.tls.enabled }}
      tls:
        - hosts:
            - "{{"{{"}}SESSION_ID{{"}}"}}.{{"{{"}}LAB_DOMAIN{{"}}"}}"
          secretName: "{{"{{"}}SESSION_ID{{"}}"}}-tls"
      {{- end }}
      rules:
        - host: "{{"{{"}}SESSION_ID{{"}}"}}.{{"{{"}}LAB_DOMAIN{{"}}"}}"
          http:
            paths:
              - path: /websockify
                pathType: Prefix
                backend:
                  service:
                    name: "{{"{{"}}POD_NAME{{"}}"}}"
                    port:
                      number: 4000
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: "{{"{{"}}POD_NAME{{"}}"}}"
                    port:
                      number: 4000
{{- end }}
