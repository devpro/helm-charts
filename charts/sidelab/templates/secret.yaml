{{- include "sidelab.validateValues" . }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sidelab.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
type: Opaque
stringData:
  # jwt-secret/admin-password are stable across upgrades: the helpers below
  # read back the existing Secret's value via `lookup` when auth.jwtSecret /
  # auth.adminPassword are left empty, and only generate a fresh random value
  # the first time (no prior Secret found). `helm template` has no cluster to
  # look up against, so an offline render always shows a fresh value here —
  # that's expected, not a sign it will actually rotate on a real upgrade.
  jwt-secret: {{ include "sidelab.jwtSecret" . | quote }}
  admin-username: {{ .Values.auth.adminUsername | quote }}
  admin-password: {{ include "sidelab.adminPassword" . | quote }}
{{- end }}
{{- if and (eq .Values.database.backend "mongo") (not .Values.database.mongo.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sidelab.mongoSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sidelab.labels" . | nindent 4 }}
type: Opaque
stringData:
  mongodb-url: {{ include "sidelab.mongoUrl" . | quote }}
{{- end }}
