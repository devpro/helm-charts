suite: deployment
# secret.yaml is rendered too, the Deployment carrying its checksum.
templates:
  - deployment.yaml
  - secret.yaml
set:
  image.repository: registry.example.com/fallstar
  image.tag: "1.0.1"
release:
  name: fallstar
tests:
  - it: runs the pinned image
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/fallstar:1.0.1
  - it: keeps service links off, so no FALLSTAR_PORT reaches the server
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.enableServiceLinks
          value: false
  - it: recreates the Pod on SQLite
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.strategy.type
          value: Recreate
      - template: deployment.yaml
        equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: fallstar-data
  - it: rolls on MongoDB without a volume
    set:
      database.backend: mongo
      database.mongo.url: mongodb://db:27017/fallstar
      persistence.enabled: false
      replicaCount: 3
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.strategy.type
          value: RollingUpdate
      - template: deployment.yaml
        equal:
          path: spec.replicas
          value: 3
      - template: deployment.yaml
        isNotNull:
          path: spec.template.spec.volumes[0].emptyDir
  - it: reads the backend and the Secrets as environment variables
    set:
      database.backend: mongo
      database.mongo.url: mongodb://db:27017/fallstar
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_BACKEND
            value: mongo
      - template: deployment.yaml
        equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: fallstar-auth
            - secretRef:
                name: fallstar-mongo
  - it: reads existing Secrets when named
    set:
      auth.existingSecret: my-auth
      database.backend: mongo
      database.mongo.existingSecret: my-db
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: my-auth
            - secretRef:
                name: my-db
  - it: leaves the replicas to the autoscaler
    set:
      autoscaling.enabled: true
      database.backend: mongo
      database.mongo.url: mongodb://db:27017/fallstar
      persistence.enabled: false
      resources.requests.cpu: 100m
    asserts:
      - template: deployment.yaml
        notExists:
          path: spec.replicas
  - it: mounts an existing claim when named
    set:
      persistence.existingClaim: my-data
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: my-data
