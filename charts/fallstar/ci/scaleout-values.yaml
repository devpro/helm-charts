# Scale-out: MongoDB, no volume, several replicas.
# Guards the RollingUpdate branch of the Deployment strategy and the replica validation in _helpers.tpl.
image:
  repository: ci-dummy-registry/fallstar

replicaCount: 3

database:
  backend: mongo
  mongo:
    url: mongodb://ci-dummy-host:27017/fallstar

persistence:
  enabled: false

podDisruptionBudget:
  enabled: true
