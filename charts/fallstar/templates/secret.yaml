{{- include "fallstar.validateValues" . }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fallstar.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fallstar.labels" . | nindent 4 }}
type: Opaque
stringData:
  FALLSTAR_SECRET: {{ .Values.auth.secret | default (include "fallstar.generated" (dict "root" . "key" "FALLSTAR_SECRET" "length" 48)) | quote }}
  ADMIN_USERNAME: {{ .Values.auth.adminUsername | quote }}
  ADMIN_PASSWORD: {{ .Values.auth.adminPassword | default (include "fallstar.generated" (dict "root" . "key" "ADMIN_PASSWORD" "length" 20)) | quote }}
{{- end }}
{{- if and (eq .Values.database.backend "mongo") (not .Values.database.mongo.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fallstar.mongoSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fallstar.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ .Values.database.mongo.url | quote }}
{{- end }}
