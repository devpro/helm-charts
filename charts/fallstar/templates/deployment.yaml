apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fallstar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fallstar.labels" . | nindent 4 }}
spec:
  # One Pod only: the SQLite file and the repository mirrors are local to it, so the old Pod must be gone before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fallstar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fallstar.selectorLabels" . | nindent 8 }}
      annotations:
        # Environment variables are read at start, so an edited Secret needs a rollout.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # A Service named fallstar would inject FALLSTAR_PORT=tcp://..., which the server reads as its port.
      enableServiceLinks: false
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fallstar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4500
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "fallstar.authSecretName" . }}
            {{- if eq .Values.database.backend "mongo" }}
            - secretRef:
                name: {{ include "fallstar.mongoSecretName" . }}
            {{- end }}
          env:
            - name: DB_BACKEND
              value: {{ .Values.database.backend | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "fallstar.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
