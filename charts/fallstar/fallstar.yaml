# Recipe of this chart for Fallstar: the choices a Fallstar deployment makes, and the values each one implies.
# Format: https://github.com/devpro/fallstar/blob/main/docs/sources.md
title: Fallstar
description: GitOps made easy, a catalog of recipes rendered into Flux, Argo CD or Fleet manifests on git branches.
category: application
namespace: fallstar
layer: apps
# The namespace is a resource of the infra layer, so the ExternalSecrets of the apps layer find it before the release exists.
createNamespace: false

options:
  - key: host
    title: Host
    type: string
    default: fallstar.${{ cluster.domain }}
    value: ingress.host
  - key: tag
    title: Image tag
    description: A pkg.yml run of the Fallstar repository, 1.0.<run_id>.
    type: string
    value: image.tag
  - key: privateImages
    title: Image pulled with a ghcr.io token
    group: Image
    type: boolean
    default: true

  - key: database
    title: Database
    description: SQLite is one file on one volume, MongoDB allows several replicas.
    group: Database
    type: enum
    values: [sqlite, mongo]
    default: sqlite
  - key: storageSize
    title: Volume size
    description: The SQLite file and the mirrors of the repositories.
    group: Database
    type: string
    default: 2Gi
    value: persistence.size
    when: { equals: { database: sqlite } }
  - key: storageClass
    title: Storage class
    description: Empty for the cluster default.
    group: Database
    type: string
    value: persistence.storageClass
    when: { equals: { database: sqlite } }
  - key: replicas
    title: Replicas
    group: Database
    type: number
    default: 1
    bind: { chart: fallstar, path: [values, replicaCount] }
    when: { equals: { database: mongo } }

  - key: ingressClass
    title: Ingress class
    group: Access
    type: string
    default: ${{ cluster.uses.ingress }}
    value: ingress.className
  - key: clusterIssuer
    title: Certificate issuer
    description: A cert-manager ClusterIssuer ordering a certificate for the host, the ingress default certificate when empty.
    group: Access
    type: string
    bind: { chart: fallstar, path: [values, ingress, annotations, cert-manager.io/cluster-issuer] }

values:
  image:
    repository: ghcr.io/devpro/fallstar
  ingress:
    enabled: true
    tls:
      enabled: true

patches:
  - when: { secretsManaged: true }
    chart: fallstar
    patch:
      values:
        auth:
          existingSecret: fallstar-auth
  - when: { equals: { database: sqlite } }
    chart: fallstar
    patch:
      values:
        database:
          backend: sqlite
        persistence:
          enabled: true
  - when: { equals: { database: mongo } }
    chart: fallstar
    notes:
      - path: [values, persistence]
        text: The mirrors of the repositories are re-created from their remotes, so no Pod needs a volume.
    patch:
      values:
        replicaCount: ${{ options.replicas }}
        database:
          backend: mongo
          mongo:
            existingSecret: fallstar-db
        persistence:
          enabled: false
  - when: { option: privateImages }
    chart: fallstar
    patch:
      values:
        imagePullSecrets:
          - name: ghcr-pull
  - when: { option: clusterIssuer }
    chart: fallstar
    patch:
      values:
        ingress:
          annotations:
            cert-manager.io/cluster-issuer: ${{ options.clusterIssuer }}

resources:
  - file: infra/namespaces/fallstar.yaml
    shared: true
    object:
      apiVersion: v1
      kind: Namespace
      metadata: { name: fallstar }
  - file: apps/externalsecrets/fallstar.yaml
    when: { secretStore: true }
    notes:
      - path: []
        text: Held in the secret store rather than generated by the chart, so a rebuilt cluster keeps the stored repository tokens readable and the same admin password.
    object:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: { name: fallstar-auth, namespace: fallstar }
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: ${{ cluster.secretStore }}
          kind: ClusterSecretStore
        target:
          name: fallstar-auth
          creationPolicy: Owner
          template:
            data:
              FALLSTAR_SECRET: "{{ .secret }}"
              ADMIN_USERNAME: admin
              ADMIN_PASSWORD: "{{ .adminPassword }}"
        data:
          - secretKey: secret
            remoteRef:
              key: fallstar-secret
          - secretKey: adminPassword
            remoteRef:
              key: fallstar-admin-password
  - file: apps/externalsecrets/fallstar.yaml
    when: { secretStore: true, equals: { database: mongo } }
    object:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: { name: fallstar-db, namespace: fallstar }
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: ${{ cluster.secretStore }}
          kind: ClusterSecretStore
        target:
          name: fallstar-db
          creationPolicy: Owner
        data:
          - secretKey: DB_URL
            remoteRef:
              key: fallstar-mongodb-url
  - file: apps/externalsecrets/fallstar.yaml
    when: { secretStore: true, option: privateImages }
    object:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata: { name: ghcr-pull, namespace: fallstar }
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: ${{ cluster.secretStore }}
          kind: ClusterSecretStore
        target:
          name: ghcr-pull
          creationPolicy: Owner
          template:
            type: kubernetes.io/dockerconfigjson
            data:
              .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
        data:
          - secretKey: username
            remoteRef:
              key: ghcr-username
          - secretKey: password
            remoteRef:
              key: ghcr-token

secrets:
  - { name: fallstar-secret, description: "Master secret, at least 32 characters: it signs the sessions and encrypts the stored repository tokens.", generate: hex32, when: { secretsManaged: true }, target: { secret: fallstar-auth, key: FALLSTAR_SECRET, namespace: fallstar } }
  - { name: fallstar-admin-username, description: Name of the admin account., value: admin, when: { secretsManaged: true, secretStore: false }, target: { secret: fallstar-auth, key: ADMIN_USERNAME, namespace: fallstar } }
  - { name: fallstar-admin-password, description: Password of the admin account., when: { secretsManaged: true }, target: { secret: fallstar-auth, key: ADMIN_PASSWORD, namespace: fallstar } }
  - { name: fallstar-mongodb-url, description: "MongoDB connection string, mongodb+srv://<user>:<password>@<host>/fallstar.", when: { secretsManaged: true, equals: { database: mongo } }, target: { secret: fallstar-db, key: DB_URL, namespace: fallstar } }
  - { name: ghcr-username, description: GitHub user pulling the private image., when: { secretStore: true, option: privateImages } }
  - { name: ghcr-token, description: "GitHub token with read:packages on ghcr.io/devpro.", when: { secretStore: true, option: privateImages } }

warnings:
  - when: { secretsManaged: false, equals: { database: mongo } }
    text: reads its database from Secret fallstar-db in namespace fallstar, which neither a secret store nor SOPS creates on this cluster

guide:
  prerequisites:
    - A DNS record of the host to the ingress load balancer IP.
    - "With the private image and SOPS: a ghcr-pull Secret of type kubernetes.io/dockerconfigjson in namespace fallstar."
  verify:
    - kubectl get pods -n fallstar
    - kubectl logs -n fallstar deploy/fallstar --tail=30
  gotchas:
    - title: Pod ImagePullBackOff
      cause: ghcr-pull missing, or a token without read:packages.
      fix: kubectl get secret -n fallstar ghcr-pull
    - title: Second replica fails to start
      cause: SQLite is one file on a ReadWriteOnce volume.
      fix: Choose MongoDB before raising the replicas.
    - title: Stored repository tokens no longer readable
      cause: FALLSTAR_SECRET changed, it encrypts them.
      fix: Restore the previous secret, or enter the tokens again.
