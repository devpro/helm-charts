{{- if .Values.networkpolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trackboard.fullname" . }}
  labels:
    {{- include "trackboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trackboard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # allow traffic only from the ingress controller namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # allows DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # allows outbound HTTPS (for Google Fonts CDN)
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
