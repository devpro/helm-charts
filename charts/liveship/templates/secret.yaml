{{- include "liveship.validateValues" . }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "liveship.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "liveship.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ include "liveship.nextauthSecret" . | quote }}
  # Losing this key makes every stored connection credential undecryptable —
  # see the warning on auth.encryptionKey in values.yaml.
  ENCRYPTION_KEY: {{ include "liveship.encryptionKey" . | quote }}
{{- end }}
{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "liveship.mongoSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "liveship.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGODB_URI: {{ include "liveship.mongoUri" . | quote }}
{{- end }}
