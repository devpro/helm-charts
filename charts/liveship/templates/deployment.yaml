apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "liveship.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "liveship.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # No local state at all (see the replicaCount note in values.yaml) —
    # always safe to roll without downtime.
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "liveship.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "liveship.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # forces a rollout when the rendered ConfigMap/Secret content changes,
        # even if the image tag doesn't — env vars are only read at container
        # start, so Kubernetes won't otherwise notice a ConfigMap/Secret edit.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "liveship.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      restartPolicy: Always
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: liveship
          image: "{{ .Values.image.repository }}:{{ include "liveship.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "liveship.fullname" . }}-config
            # The Secrets' keys match the app's env var names exactly
            # (envFrom has no per-key rename).
            - secretRef:
                name: {{ include "liveship.authSecretName" . }}
            - secretRef:
                name: {{ include "liveship.mongoSecretName" . }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Writable /tmp and Next.js runtime cache (image optimizer etc.) —
            # both emptyDirs, so containerSecurityContext.readOnlyRootFilesystem
            # can be enabled without further changes. Per-Pod caches, not shared
            # state: nothing the app relies on across replicas or restarts.
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
